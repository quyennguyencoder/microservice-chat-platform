global:
  scrape_interval: 15s
  scrape_timeout: 10s # Thêm timeout để tránh kẹt request

# comment lại phần này vì chuyển sang dùng Grafana Managed Alerts
# rule_files:
#   - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  # Job nội bộ giám sát chính Prometheus
  - job_name: 'prometheus-self'
    static_configs:
      - targets: ['localhost:9090']

  # Gộp toàn bộ Microservices vào 1 Job duy nhất cho gọn
  - job_name: 'spring-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          app: 'api-gateway'
      - targets: ['host.docker.internal:8010']
        labels:
          app: 'user-service'
      - targets: ['host.docker.internal:8020']
        labels:
          app: 'chat-service'
      - targets: ['host.docker.internal:8030']
        labels:
          app: 'notification-service'
      - targets: ['host.docker.internal:8040']
        labels:
          app: 'search-service'
      - targets: ['host.docker.internal:8050']
        labels:
          app: 'storage-service'
